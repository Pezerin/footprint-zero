<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Footprint Zero</title>
  </head>
  <body>
    <div id="header">
      <h1>Footprint Zero</h1>
    </div>
    <div id="content">
      <div id="calc">
        <h1>Calculate your carbon footprint:</h1>
        <iframe
          width="710"
          height="1300"
          frameborder="0"
          marginwidth="0"
          marginheight="0"
          scrolling="no"
          src="https://calculator.carbonfootprint.com/calculator.aspx"
        ></iframe>
      </div>
      <div id="display">
        <div id="input">
          <form id="carbonForm">
            <label for="footprint">Enter your yearly carbon footprint: </label>
            <input type="text" name="footprint" id="footprint" />
            <button type="submit" id="carbonButton">Submit</button>
          </form>
          <h1 id="currentFootprint">Carbon Footprint (metric tons):</h1>
        </div>
        <div id="tips">
          <h1>Tips:</h1>
        </div>
      </div>
    </div>
  </body>
</html>
